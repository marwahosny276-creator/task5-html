<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>student registration</title>
</head>
<body>
    <div>
<form action="" >
    <fieldset> 
        <legend>student register</legend>
        <!-- البيانات الشخصيه وبيانات تسجيل الدخول -->
    <label for="user">username</label>
<input id="user" type="text" placeholder="username" required>
<br>
 <label for="ag">age</label>
<input id="ag" type="number" placeholder="age" required>
<br>
 <label for="email">email</label>
<input id="email" type="email" placeholder="email" required>
<br>
 <label for="phone">phone</label>
<input id="phone" type="number" placeholder="phone" required>
<br>
 <label for="pass">password</label>
<input id="pass" type="password" placeholder="password" required>
<br>
<!-- تاريخ الميلاد -->
 <label for="birth">birthday</label>
<input id="birth" type="date" placeholder="birthday" required>
<br>
<!-- الاسئله المطلوب الاجابه عنها  -->
<h3>لغه البرمجه المفضله؟</h3>
<label for="html">html</label>
<input type="radio" name="fvalang" id="html" value="html">
<br>
<label for="css">css</label>
<input type="radio" name="favlang" id="css" value="css">
<br>
<label for="js">js</label>
<input type="radio" name="favlang" id="js" value="js" >
<br>
<br>
<h3>التقنيات التي تعرفها؟</h3>
<label for="html">بناء هيكل </label>
<input type="checkbox" name="teck" id="html" value="بناء هيكل">
<br>
<label for="css">تنسيق</label>
<input type="checkbox" name="teck" id="css" value="تنسيق">
<br>
<label for="js">تنفيذ الكود</label>
<input type="checkbox" name="teac" id="js" value="تنفيذ الكود" >
<br>
<br>
<h3>مستواك ف البرمجه؟</h3>
<label for="be">مبتدأ</label>
<input type="radio" name="teck" id="be" value="مبتدأ">
<br>
<label for="med">متوسط</label>
<input type="radio" name="teck" id="med" value="متوسط">
<br>
<label for="flu">متقدم</label>
<input type="radio" name="teac" id="flu" value="متقدم" >
<br>
<br>
<h3>الكورس الذي تريد دراسته؟</h3>
<label for="front">front-end</label>
<input type="checkbox" name="teck" id="front" value="front-end">
<br>
<label for="back">back-end</label>
<input type="checkbox" name="teck" id="back" value="back-end">
<br>
<label for="mob">mobile-app</label>
<input type="checkbox" name="teac" id="mob" value="mobil-app" >
<br>
<br>
<h3>نبذه عن اهدافك من تعلم البرمجه؟</h3>
<label for="txt">نبذه عنك</label>
<input type="text" name="teck" id="txt" placeholder="اكتب نبذه عنك">
<br>
<br>
<!-- الارسال  -->
<input type="submit">
<a href="choose.html">انتقل الي الصفحه الاخري </a>
</fieldset>
</form>





    </div>
</body>
</html>
